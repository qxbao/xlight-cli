[package]
name = "xlightcli-provider-claude"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
description = "Claude provider adapter: anthropic-api (stable) + claude-subscription (experimental)"

[features]
default = []
# Experimental transport, off by default (D-002). Compile-time gate; also requires the
# runtime opt-in in `[experimental]` global config before `TransportGate` allows calls.
claude-subscription = []

[lints]
workspace = true

[dependencies]
xlightcli-protocol = { workspace = true }
xlightcli-auth = { workspace = true }
xlightcli-provider = { workspace = true }
xlightcli-config = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
xlightcli-auth = { workspace = true, features = ["testing"] }
xlightcli-provider = { workspace = true, features = ["testing"] }
insta = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

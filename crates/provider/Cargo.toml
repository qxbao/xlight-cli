[package]
name = "xlightcli-provider"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
description = "Provider/TransportAdapter traits and shared adapter infrastructure (HTTP, SSE, retry, gate)"

[features]
# MockProvider/MockTransport + fixture replay helpers for runtime and adapter tests.
testing = ["dep:async-stream", "xlightcli-auth/testing"]

[lints]
workspace = true

[dependencies]
xlightcli-protocol = { workspace = true }
xlightcli-auth = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }

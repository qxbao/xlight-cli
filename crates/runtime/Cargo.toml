[package]
name = "xlightcli-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
description = "Provider-independent agent runtime: Session, AgentLoop, ContextManager, Scheduler (Phase 1+ skeleton)"

[features]
# MockProvider-backed RuntimeHandle helper for runtime tests (docs/PLAN.md §16) and for `tui`'s
# own tests to depend on without pulling in a real provider crate.
testing = ["xlightcli-provider/testing", "xlightcli-auth/testing"]

[lints]
workspace = true

[dependencies]
xlightcli-protocol = { workspace = true }
xlightcli-config = { workspace = true }
xlightcli-storage = { workspace = true }
xlightcli-auth = { workspace = true }
xlightcli-provider = { workspace = true }
xlightcli-tools = { workspace = true }
xlightcli-mcp = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
# Matches `.agents/rules/*.md`-style globs when `ContextManager` discovers project rule files
# (docs/PLAN.md §9.2); already a workspace dependency (used by `xlightcli-tools`'s
# `PermissionEngine`), so this doesn't add a new external dependency to the workspace.
globset = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
insta = { workspace = true }
uuid = { workspace = true }
async-stream = { workspace = true }
secrecy = { workspace = true }
